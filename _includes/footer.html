  <footer>
        <div class="container">
            <div class="row" style="margin-bottom: 30px;">
                <div class="col-md-12 text-center">
                    <img src="{{ '/img/logos/logo- transparent.png' | prepend: site.baseurl }}" alt="CareAssist Logo" style="height: 100px; margin-bottom: 15px;">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <span class="copyright">Copyright &copy; {{ site.title }} {{ 'now' | date: "%Y" }}</span>
                </div>
                <div class="col-md-4">
                    <ul class="list-inline social-buttons">
                        {% for network in site.social %}
                        <li><a href="{{ network.url }}"><i class="fa fa-{{ network.title }}"></i></a>
                        </li>
                        {% endfor %}
                    </ul>
                </div>
                <div class="col-md-4">
                    <ul class="list-inline quicklinks">
                        <li><a href="#">Privacy Policy</a>
                        </li>
                        <li><a href="#">Terms of Use</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
