<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Children style doodle background</title>
  <desc id="desc">A playful drawing style background with sun, clouds, rainbow and house sketch lines.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff4ff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c7f2c8"/>
      <stop offset="100%" stop-color="#e4f9d9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="650" width="1600" height="250" fill="url(#ground)"/>

  <!-- Sun -->
  <circle cx="1320" cy="150" r="70" fill="#ffd75e" stroke="#f5b700" stroke-width="8"/>
  <g stroke="#f5b700" stroke-width="8" stroke-linecap="round">
    <line x1="1320" y1="40" x2="1320" y2="5"/>
    <line x1="1320" y1="295" x2="1320" y2="260"/>
    <line x1="1210" y1="150" x2="1175" y2="150"/>
    <line x1="1465" y1="150" x2="1430" y2="150"/>
    <line x1="1242" y1="72" x2="1218" y2="48"/>
    <line x1="1398" y1="228" x2="1422" y2="252"/>
    <line x1="1242" y1="228" x2="1218" y2="252"/>
    <line x1="1398" y1="72" x2="1422" y2="48"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.95" stroke="#a9d9f5" stroke-width="4">
    <ellipse cx="280" cy="170" rx="90" ry="45"/>
    <ellipse cx="360" cy="165" rx="70" ry="38"/>
    <ellipse cx="220" cy="175" rx="70" ry="35"/>

    <ellipse cx="830" cy="120" rx="85" ry="42"/>
    <ellipse cx="900" cy="118" rx="65" ry="35"/>
    <ellipse cx="770" cy="124" rx="65" ry="33"/>
  </g>

  <!-- Rainbow -->
  <path d="M180 640 A310 310 0 0 1 800 640" fill="none" stroke="#ff5f5f" stroke-width="20" stroke-linecap="round"/>
  <path d="M205 640 A285 285 0 0 1 775 640" fill="none" stroke="#ffa24b" stroke-width="20" stroke-linecap="round"/>
  <path d="M230 640 A260 260 0 0 1 750 640" fill="none" stroke="#ffd95a" stroke-width="20" stroke-linecap="round"/>
  <path d="M255 640 A235 235 0 0 1 725 640" fill="none" stroke="#61d26c" stroke-width="20" stroke-linecap="round"/>
  <path d="M280 640 A210 210 0 0 1 700 640" fill="none" stroke="#5ec6ff" stroke-width="20" stroke-linecap="round"/>

  <!-- Childlike house doodle -->
  <g transform="translate(930 395)">
    <rect x="0" y="145" width="260" height="190" fill="#ffe6b0" stroke="#d18b55" stroke-width="8"/>
    <polygon points="-20,150 130,30 280,150" fill="#ff7a7a" stroke="#cc5151" stroke-width="8"/>
    <rect x="30" y="200" width="70" height="60" fill="#bde8ff" stroke="#6aa3c8" stroke-width="6"/>
    <rect x="160" y="200" width="70" height="60" fill="#bde8ff" stroke="#6aa3c8" stroke-width="6"/>
    <rect x="110" y="235" width="45" height="100" fill="#c58e66" stroke="#8c6043" stroke-width="6"/>
    <circle cx="145" cy="285" r="5" fill="#6f462f"/>
  </g>

  <!-- Crayon squiggles -->
  <path d="M70 760 C180 700, 260 820, 360 760 S560 700, 650 760" fill="none" stroke="#ff7f7f" stroke-width="8" stroke-linecap="round"/>
  <path d="M880 760 C960 705, 1045 815, 1130 760 S1300 705, 1420 760" fill="none" stroke="#6aa9ff" stroke-width="8" stroke-linecap="round"/>
  <path d="M420 820 C520 760, 610 870, 700 820" fill="none" stroke="#7fd37f" stroke-width="8" stroke-linecap="round"/>
</svg>
